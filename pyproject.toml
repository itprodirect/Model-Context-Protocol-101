[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harborlight-mcp"
version = "1.0.0"
description = "A beginner-friendly MCP tutorial using fictional insurance renewals"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Nick Ferguson / IT Pro Direct"}]
keywords = ["mcp", "model-context-protocol", "insurance", "tutorial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Education",
]
dependencies = [
    "mcp[cli]>=1.28,<2",
    "pydantic>=2.11,<3",
    "typing-extensions>=4.9",
]

[project.urls]
Repository = "https://github.com/itprodirect/Model-Context-Protocol-101"
Issues = "https://github.com/itprodirect/Model-Context-Protocol-101/issues"

[project.optional-dependencies]
dev = [
    "ipykernel>=6,<8",
    "nbconvert>=7,<8",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
harborlight-mcp = "harborlight_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harborlight_mcp = ["data/*.csv"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
